name: x-watcher-rsshub
services:
  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      CACHE_EXPIRE: "300"
      CACHE_CONTENT_EXPIRE: "3600"
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:?Set TWITTER_AUTH_TOKEN in deploy/rsshub/.env}
      DEBUG_INFO: "false"
      LOGGER_LEVEL: error
      NO_LOGFILES: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  redis-data:
